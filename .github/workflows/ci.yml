name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: recallfarm
          POSTGRES_PASSWORD: recallfarm
          POSTGRES_DB: recallfarm_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U recallfarm" --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: apps/api
    env:
      DATABASE_URL: postgres://recallfarm:recallfarm@localhost:5432/recallfarm_test
      TEST_DATABASE_URL: postgres://recallfarm:recallfarm@localhost:5432/recallfarm_test
      PACKS_DIR: ${{ github.workspace }}/packages/params/packs
      JWT_ACCESS_SECRET: ci-access
      JWT_REFRESH_SECRET: ci-refresh
      PAYMENT_WEBHOOK_SECRET: ci-webhook
      OTP_DEV_ECHO: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/api/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      # Unitaires avec couverture : 100 % des branches exigees sur src/params/engine et src/params/expr (jest.config.js).
      - run: npm run test:cov
      - run: npm run test:e2e:cov
      - name: Couverture fusionnee unitaires + e2e (seuils bloquants)
        run: >
          node ../../tests/coverage/merge-api.js .
          --min-lines=81 --min-branches=58
          --scope=src/params/engine:100:100 --scope=src/params/expr:100:100
          --json=coverage-merged/summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-api
          path: |
            apps/api/coverage-merged/
            apps/api/coverage/lcov.info
            apps/api/coverage-e2e/lcov.info
          retention-days: 14
      - name: Contrat OpenAPI à jour
        run: npm run openapi && git diff --exit-code openapi.json

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      - run: npm run lint
      # Tests + couverture (seuils de non-regression dans vite.config.ts)
      - run: npm run test:coverage
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-web
          path: apps/web/coverage/
          retention-days: 14

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: 3.38.3, cache: true }
      - name: Générer les dossiers de plateforme
        run: test -d android || flutter create --platforms=android --org app.recallfarm --project-name recallfarm .
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --coverage
      # flutter ne produit pas de couverture de branches : seuils sur les lignes (voir tests/coverage/lcov-check.js).
      - name: Couverture Flutter (seuils bloquants)
        working-directory: .
        run: >
          node tests/coverage/lcov-check.js apps/mobile/coverage/lcov.info apps/mobile/lib
          --min-total=16
          --scope=core/params:79
          --scope=core/params/expr:91 --scope=core/params/resolution:86 --scope=core/params/form_engine:92
          --scope=core/params/inbreeding:81 --scope=core/params/reminder_engine:93
          --json=apps/mobile/coverage/summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-mobile
          path: apps/mobile/coverage/
          retention-days: 14
      - run: flutter build apk --release --dart-define=API_BASE_URL=${{ vars.PILOT_API_URL || 'https://pilote.recallfarm.app/v1' }}
      - uses: actions/upload-artifact@v4
        with:
          name: recallfarm-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk

  parity:
    needs: [api, mobile]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/api/package-lock.json }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: 3.38.3, cache: true }
      - name: Install API deps
        run: cd apps/api && npm ci
      - name: Install Mobile deps
        run: cd apps/mobile && flutter pub get
      - name: TS engine tests
        run: cd apps/api && npx jest --config jest.config.js --testPathPattern=engines
      - name: Dart engine tests
        run: cd apps/mobile && flutter test test/engines/
      - name: Bundled packs match source
        run: |
          for f in apps/mobile/assets/packs/*.json; do
            base=$(basename "$f")
            diff -q "$f" "packages/params/packs/$base" || { echo "DRIFT: $base"; exit 1; }
          done
          echo "All packs identical"

  # Scan Trivy des images api et web : CRITICAL bloque, HIGH est rapporte (artefact, non bloquant).
  # Le cache de couches (type=gha) est partage avec le job `images`. S'execute en parallele des tests.
  security:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.image }}/Dockerfile
          load: true
          push: false
          pull: true # images de base les plus recentes : un correctif Alpine publie ferme la CVE sans changer le code
          tags: recallfarm-${{ matrix.image }}:scan
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
      - name: Rapport HIGH (informatif)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: recallfarm-${{ matrix.image }}:scan
          severity: HIGH
          ignore-unfixed: true
          format: table
          output: trivy-high-${{ matrix.image }}.txt
          exit-code: "0"
      - name: Scan CRITICAL (bloquant)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: recallfarm-${{ matrix.image }}:scan
          severity: CRITICAL
          ignore-unfixed: true
          format: table
          output: trivy-critical-${{ matrix.image }}.txt
          exit-code: "1"
      - name: Afficher les rapports
        if: always()
        run: |
          for f in trivy-*-${{ matrix.image }}.txt; do echo "== $f"; cat "$f"; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-${{ matrix.image }}
          path: trivy-*-${{ matrix.image }}.txt
          retention-days: 14

  images:
    needs: [api, web, parity, security]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/recallfarm-api:${{ github.sha }},ghcr.io/${{ github.repository_owner }}/recallfarm-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/recallfarm-web:${{ github.sha }},ghcr.io/${{ github.repository_owner }}/recallfarm-web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
