name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: recallfarm
          POSTGRES_PASSWORD: recallfarm
          POSTGRES_DB: recallfarm_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U recallfarm" --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: apps/api
    env:
      DATABASE_URL: postgres://recallfarm:recallfarm@localhost:5432/recallfarm_test
      TEST_DATABASE_URL: postgres://recallfarm:recallfarm@localhost:5432/recallfarm_test
      PACKS_DIR: ${{ github.workspace }}/packages/params/packs
      JWT_ACCESS_SECRET: ci-access
      JWT_REFRESH_SECRET: ci-refresh
      PAYMENT_WEBHOOK_SECRET: ci-webhook
      OTP_DEV_ECHO: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/api/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm run test:e2e
      - name: Contrat OpenAPI à jour
        run: npm run openapi && git diff --exit-code openapi.json

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: 3.24.5, cache: true }
      - name: Générer les dossiers de plateforme
        run: test -d android || flutter create --platforms=android --org app.recallfarm --project-name recallfarm .
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release --dart-define=API_BASE_URL=${{ vars.PILOT_API_URL || 'https://pilote.recallfarm.app/v1' }}
      - uses: actions/upload-artifact@v4
        with:
          name: recallfarm-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk

  parity:
    needs: [api, mobile]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/api/package-lock.json }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: 3.24.5, cache: true }
      - name: Install API deps
        run: cd apps/api && npm ci
      - name: Install Mobile deps
        run: cd apps/mobile && flutter pub get
      - name: TS engine tests
        run: cd apps/api && npx jest --config jest.config.js --testPathPattern=engines
      - name: Dart engine tests
        run: cd apps/mobile && flutter test test/engines/
      - name: Bundled packs match source
        run: |
          for f in apps/mobile/assets/packs/*.json; do
            base=$(basename "$f")
            diff -q "$f" "packages/params/packs/$base" || { echo "DRIFT: $base"; exit 1; }
          done
          echo "All packs identical"

  images:
    needs: [api, web, parity]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/recallfarm-api:${{ github.sha }},ghcr.io/${{ github.repository_owner }}/recallfarm-api:latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/recallfarm-web:${{ github.sha }},ghcr.io/${{ github.repository_owner }}/recallfarm-web:latest
