# Passerelle RecallFarm : un seul point d'entrée.
#   /v1/*  → API NestJS     /*  → web (site public + admin + studio)
# En production, placer un terminateur TLS devant (voir docs/DEPLOIEMENT.md) ou monter les certificats ici.

limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=otp_per_ip:10m rate=6r/m;

upstream rf_api { server api:3000; keepalive 16; }
upstream rf_web { server web:8080; keepalive 8; }

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
  listen 80;
  server_name _;
  server_tokens off;
  client_max_body_size 10m;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 512;
  gzip_types application/json text/csv application/javascript text/css image/svg+xml;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;

  location = /v1/auth/otp/request {
    limit_req zone=otp_per_ip burst=3 nodelay;
    proxy_pass http://rf_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /v1/ {
    limit_req zone=api_per_ip burst=40 nodelay;
    proxy_pass http://rf_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  location / {
    proxy_pass http://rf_web;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
  }
}
