# Blocs a ajouter au nginx de RecallVet (docker/nginx/nginx.conf, dans http { }).
# Etape 1 (avant le certificat) : seul le bloc "listen 80" est actif pour le defi ACME.
# Etape 2 : certificat obtenu → activer le bloc 443.

    server {
        listen 80;
        server_name recallfarm.com www.recallfarm.com;
        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        location / { return 301 https://recallfarm.com$request_uri; }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name recallfarm.com www.recallfarm.com;
        ssl_certificate /etc/nginx/ssl/live/recallfarm.com/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/live/recallfarm.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        add_header Strict-Transport-Security "max-age=31536000" always;
        client_max_body_size 10m;

        if ($host = www.recallfarm.com) { return 301 https://recallfarm.com$request_uri; }

        location / {
            # Resolution a la demande : RecallVet demarre meme si RecallFarm est arrete.
            resolver 127.0.0.11 valid=30s;
            set $rf_gateway http://recallfarm-gateway:80;
            proxy_pass $rf_gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 60s;
        }
    }
