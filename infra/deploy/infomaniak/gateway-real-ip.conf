# La passerelle n'est joignable que par le nginx de RecallVet (reseau Docker prive) :
# on reprend l'adresse du client transmise par ce relais, sinon la limitation de debit
# (OTP, API) s'appliquerait a tous les utilisateurs a la fois.
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;
