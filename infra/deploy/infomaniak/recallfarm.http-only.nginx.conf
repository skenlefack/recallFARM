# Phase 1 (avant le certificat) : recallfarm.com servi en HTTP et defi ACME.
# Installe dans le nginx de RecallVet : /home/ubuntu/recallvet/docker/nginx/ssl/sites/recallfarm.conf
# (dossier monte en /etc/nginx/ssl, ignore par git) + "include /etc/nginx/ssl/sites/*.conf;" dans http { }.
server {
    listen 80;
    server_name recallfarm.com www.recallfarm.com;
    client_max_body_size 10m;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / {
        resolver 127.0.0.11 valid=30s;
        set $rf_gateway http://recallfarm-gateway:80;
        proxy_pass $rf_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
