# RecallFarm — pile complète conteneurisée (dev, recette, pilote)
#   cp .env.example .env && docker compose up -d --build
#   Web + admin : http://localhost:8080   API : http://localhost:8080/v1   Docs API : http://localhost:8080/v1/docs
# Profils facultatifs : --profile demo (simulateur de capteurs), --profile backup (sauvegardes quotidiennes)

name: recallfarm

x-restart: &restart
  restart: unless-stopped

services:
  postgres:
    <<: *restart
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-recallfarm}
      POSTGRES_USER: ${POSTGRES_USER:-recallfarm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD dans .env}
      TZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

  redis:
    <<: *restart
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?définir REDIS_PASSWORD dans .env}"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks: [backend]

  api:
    <<: *restart
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: ${REGISTRY:-recallfarm}/api:${TAG:-latest}
    env_file: .env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-recallfarm}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-recallfarm}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      PACKS_DIR: /app/packages/params/packs
      KEYS_DIR: /app/keys
    volumes:
      - apikeys:/app/keys
      - exports:/app/var
      # Connecteurs d'agregateurs (ADR-002) : providers.json reste sur le serveur, hors depot.
      - ./infra/providers:/run/providers:ro
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks: [backend, frontend]

  web:
    <<: *restart
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: ${REGISTRY:-recallfarm}/web:${TAG:-latest}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks: [frontend]

  gateway:
    <<: *restart
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./infra/nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api: { condition: service_healthy }
      web: { condition: service_started }
    networks: [frontend]

  iot-simulator:
    profiles: ["demo"]
    image: ${REGISTRY:-recallfarm}/api:${TAG:-latest}
    command: ["node", "dist/scripts/simulate-iot.js"]
    environment:
      API_URL: http://api:3000/v1
      DATABASE_URL: postgres://${POSTGRES_USER:-recallfarm}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-recallfarm}
    depends_on:
      api: { condition: service_healthy }
    networks: [backend, frontend]

  backup:
    <<: *restart
    profiles: ["backup"]
    image: postgis/postgis:16-3.4
    entrypoint: ["/bin/sh", "/scripts/backup-loop.sh"]
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-recallfarm}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-recallfarm}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ./infra/scripts:/scripts:ro
      - ${BACKUP_DIR:-./backups}:/backups
    depends_on:
      postgres: { condition: service_healthy }
    networks: [backend]

volumes:
  pgdata:
  redisdata:
  apikeys:
  exports:

networks:
  backend:
    internal: true
  frontend:
