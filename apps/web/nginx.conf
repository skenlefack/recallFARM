# RecallFarm web — static SPA server (nginx-unprivileged, port 8080).
# /v1 is handled by the gateway (infra/nginx/gateway.conf), never by this container.
server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;
    absolute_redirect off;

    # compression
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/javascript application/json application/manifest+json image/svg+xml font/woff;

    # security headers (inherited by every location: locations below only use `expires`, never add_header)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(self), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # hashed build assets: cache for a year
    location /assets/ {
        expires 1y;
        access_log off;
        try_files $uri =404;
    }

    # service worker, manifest and the HTML shell must always be revalidated
    location = /sw.js {
        expires -1;
        try_files $uri =404;
    }
    location ~ ^/workbox-[a-z0-9]+\.js$ {
        expires 1y;
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        expires 1d;
        try_files $uri =404;
    }
    location = /index.html {
        expires -1;
    }

    # static files at the root (icons, og-image, robots.txt)
    location ~* \.(?:png|svg|ico|txt|webmanifest)$ {
        expires 7d;
        try_files $uri =404;
    }

    # the API never lives here: avoid answering index.html to API calls
    location /v1/ {
        return 404;
    }

    # SPA fallback
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
