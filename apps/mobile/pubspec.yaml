name: recallfarm
description: RecallFarm — application éleveur hors ligne d'abord (volaille, chiens), Afrique francophone.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State & navigation
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7

  # Network
  dio: ^5.4.3+1
  connectivity_plus: ^6.0.5

  # Local storage (encrypted SQLite, no codegen — replaces Drift, see README "Deviations")
  sqflite_sqlcipher: ^3.1.0
  path: ^1.9.0
  flutter_secure_storage: ^9.2.2

  # Notifications
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4

  # Utilities
  intl: ^0.20.2
  uuid: ^4.4.2
  crypto: ^3.0.3
  cryptography: ^2.7.0
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  # Tests de LocalDb sur le poste (SQLite FFI, sans chiffrement) : ADR-004.
  sqflite_common_ffi: ^2.3.4
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/packs/
    - assets/fonts/OFL-BricolageGrotesque.txt
    - assets/fonts/OFL-IBMPlexSans.txt
    - assets/fonts/OFL-IBMPlexMono.txt
  # Polices des maquettes embarquees (sous-ensemble latin, SIL OFL 1.1) :
  # aucun telechargement au premier lancement (hors ligne d'abord, 2G).
  fonts:
    - family: BricolageGrotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BricolageGrotesque-Bold.ttf
          weight: 700
        - asset: assets/fonts/BricolageGrotesque-ExtraBold.ttf
          weight: 800
    - family: IBMPlexSans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSans-Bold.ttf
          weight: 700
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexMono-SemiBold.ttf
          weight: 600
